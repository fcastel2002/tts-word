name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  addin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: addin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p . --types office-js --skipLibCheck
      - run: npm run build

  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m py_compile helper/*.py installer/*.py
